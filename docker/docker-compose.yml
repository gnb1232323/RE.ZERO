services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-re-zero-crm-app:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to localhost only — reachable from a reverse proxy (Caddy, or an
      # existing nginx) running on this same host, but never directly from the
      # internet in plaintext. See docker/DEPLOY.md for exposing it publicly
      # without a real domain (sslip.io), which is safer than opening this port.
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      SEED_USER_1_EMAIL: ${SEED_USER_1_EMAIL}
      SEED_USER_1_NAME: ${SEED_USER_1_NAME}
      SEED_USER_1_PASSWORD: ${SEED_USER_1_PASSWORD}
      SEED_USER_2_EMAIL: ${SEED_USER_2_EMAIL}
      SEED_USER_2_NAME: ${SEED_USER_2_NAME}
      SEED_USER_2_PASSWORD: ${SEED_USER_2_PASSWORD}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
